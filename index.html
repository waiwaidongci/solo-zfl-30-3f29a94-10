<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜次封存与复查台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 14px 18px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 22px; }
    h2 { font-size: 16px; margin: 14px 0 8px; }
    h3 { font-size: 14px; margin: 10px 0 6px; }
    button { border: 0; border-radius: 8px; padding: 9px 12px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { background: #64777b; }
    button.danger { background: #a8432f; }
    button.ghost { background: #e4eef0; color: #1d6c78; border: 1px solid #b9d0d3; }
    button.small { padding: 5px 9px; font-size: 12px; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 8px; font: inherit; background: #fff; color: #183035; }
    input:disabled, textarea:disabled, select:disabled { background: #eef3f4; color: #5c7378; }
    textarea { min-height: 56px; }
    label { display: block; margin: 8px 0 4px; color: #5c7378; font-size: 12px; font-weight: 700; }
    .muted { color: #5c7378; font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }

    .tabs { display: flex; gap: 6px; padding: 8px 12px 0; background: #fff; border-bottom: 1px solid #c9dadc; overflow-x: auto; }
    .tab { white-space: nowrap; background: #e4eef0; color: #1d6c78; border: 1px solid #c9dadc; border-bottom: none; border-radius: 8px 8px 0 0; }
    .tab.active { background: #1d6c78; color: #fff; }
    main { padding: 12px; }
    .view { display: none; }
    .view.active { display: block; }

    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .grid-map { display: grid; grid-template-columns: 1fr 370px; gap: 12px; align-items: start; }
    .grid-seal { display: grid; grid-template-columns: 280px 1fr; gap: 12px; align-items: start; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .map { position: relative; height: calc(100vh - 190px); min-height: 420px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .marker.sealed { cursor: not-allowed; border-style: dashed; }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }

    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .list { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .timeline { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 9px; cursor: pointer; background: #fff; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .item.sealed { border-left: 4px solid #2e8b57; }
    .pill { display: inline-block; padding: 2px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 11px; margin: 2px 4px 2px 0; }
    .pill.ok { background: #e6f4ec; border-color: #7bb991; color: #1f6b3c; }
    .pill.err { background: #fbe8e3; border-color: #cf8876; color: #8f3320; }
    .pill.warn { background: #fdf4dd; border-color: #d8b95f; color: #7a5d12; }
    .pill.info { background: #e6f0f4; border-color: #8fb6c2; color: #1d5568; }

    .banner { border-radius: 8px; padding: 10px 12px; margin: 8px 0; font-size: 13px; border: 1px solid; }
    .banner.err { background: #fbe8e3; border-color: #cf8876; color: #8f3320; }
    .banner.ok { background: #e6f4ec; border-color: #7bb991; color: #1f6b3c; }
    .banner.warn { background: #fdf4dd; border-color: #d8b95f; color: #7a5d12; }
    .banner.info { background: #e6f0f4; border-color: #8fb6c2; color: #1d5568; }
    .banner.locked { background: #f0eef8; border-color: #a596cf; color: #433180; }
    .banner ul { margin: 6px 0 0; padding-left: 18px; }

    .checksum-card { background: #0f3b45; color: #e8f6f8; border-radius: 8px; padding: 12px; margin-top: 10px; }
    .checksum-card .code { font-size: 26px; letter-spacing: 2px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .checksum-card .full { font-size: 11px; word-break: break-all; opacity: .85; }

    .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 13px; margin: 6px 0; }
    .kv dt { color: #5c7378; } .kv dd { margin: 0; }

    table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.grid th, table.grid td { border: 1px solid #d7e4e5; padding: 5px 7px; text-align: left; vertical-align: top; }
    table.grid th { background: #eef3f4; font-size: 12px; }
    .diff-add { color: #1f6b3c; } .diff-del { color: #8f3320; } .diff-chg { color: #7a5d12; }

    #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 99; display: grid; gap: 8px; width: min(520px, calc(100vw - 24px)); }
    .toast { padding: 10px 14px; border-radius: 8px; color: #fff; font-size: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
    .toast.ok { background: #1f6b3c; } .toast.err { background: #8f3320; } .toast.info { background: #1d5568; }

    details { border: 1px solid #d7e4e5; border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
    details > summary { cursor: pointer; font-weight: 700; font-size: 13px; }
    pre.raw { max-height: 180px; overflow: auto; background: #f4f8f9; border-radius: 6px; padding: 8px; font-size: 11px; white-space: pre-wrap; word-break: break-all; }

    @media (max-width: 980px) {
      .grid-map, .grid-seal { grid-template-columns: 1fr; }
      .map { height: 52vh; min-height: 320px; }
      h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>水下考古潜次封存与复查台</h1>
      <div class="muted">地图标记 · 合规封存（只读快照+校验码）· 追加复查 · 快照还原 · 审计导出</div>
    </div>
    <div id="headerActions" style="display:flex;gap:8px;align-items:center">
      <input id="operatorName" placeholder="操作人姓名（可选）" style="width:170px;padding:7px 9px" title="操作人会写入封存/导出记录">
      <button id="quickExportAudit" class="small">导出审计包</button>
      <button id="quickImport" class="small secondary">导入/恢复</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="map">标记地图（旧入口）</button>
    <button class="tab" data-view="seal">潜次封存</button>
    <button class="tab" data-view="review">复查台</button>
    <button class="tab" data-view="data">数据与审计</button>
  </nav>

  <div id="loadBanners"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>

  <main>
    <!-- ============ 视图一：地图 + 标记（旧入口保持） ============ -->
    <section class="view active" id="view-map">
      <div class="grid-map">
        <div class="panel">
          <div class="map" id="map"><div class="wreck"></div></div>
          <div class="muted" style="margin-top:6px">点击沉船平面图放置新标记；虚线圆圈属于已封存潜次（只读）。</div>
        </div>
        <aside>
          <div class="panel">
            <div class="toolbar">
              <select id="filterType"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
              <select id="filterDive"><option value="">全部潜次</option></select>
            </div>
            <div class="toolbar">
              <select id="listMode"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
              <select id="currentDive"></select>
            </div>
            <div id="markLockBanner"></div>
            <form id="markForm">
              <h2>标记信息</h2>
              <input name="id" type="hidden">
              <label>编号（重号将被拦截）</label><input name="code" required>
              <div class="row">
                <div><label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select></div>
                <div><label>所属潜次</label><select name="dive"></select></div>
              </div>
              <div class="row">
                <div><label>深度(m)</label><input name="depth" inputmode="decimal" placeholder="例如18.4" required></div>
                <div><label>朝向</label><input name="orientation" placeholder="例如东北偏北"></div>
              </div>
              <label>归属（单位/项目）</label><input name="attribution" placeholder="例如省文物考古研究院">
              <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
              <label>引用其他标记编号（逗号分隔；跨潜次引用要求对方已封存）</label><input name="refs" placeholder="例如 A-017, W-003">
              <label>备注</label><textarea name="note"></textarea>
              <div class="toolbar" id="markActions">
                <button id="saveMarkBtn">保存标记</button>
                <button type="button" id="deleteMarkBtn" class="secondary">删除</button>
              </div>
            </form>
          </div>
          <div class="panel">
            <h2 id="listTitle">标记列表</h2>
            <div id="list" class="list"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ============ 视图二：潜次封存 ============ -->
    <section class="view" id="view-seal">
      <div class="grid-seal">
        <div class="panel">
          <button id="newDiveBtn" class="small ghost" style="width:100%">＋ 新建潜次</button>
          <h2>潜次列表</h2>
          <div id="diveList" class="list"></div>
        </div>
        <div class="panel" id="sealPanel">
          <div class="muted">从左侧选择一个潜次，补登人员、气瓶、深度、时长、天气与归属后运行合规检查。</div>
        </div>
      </div>
    </section>

    <!-- ============ 视图三：复查台 ============ -->
    <section class="view" id="view-review">
      <div class="panel">
        <div class="toolbar" style="grid-template-columns: 1fr auto;">
          <select id="reviewDive"></select>
          <button id="goSealFromReview" class="small ghost" type="button">前往封存</button>
        </div>
        <div id="reviewBody"><div class="muted">已封存的潜次才能追加复查。</div></div>
      </div>
    </section>

    <!-- ============ 视图四：数据与审计 ============ -->
    <section class="view" id="view-data">
      <div class="panel">
        <h2>数据安全操作</h2>
        <div class="row3">
          <button id="exportAuditBtn">导出审计包（含校验）</button>
          <button id="exportStateBtn" class="secondary">导出当前数据 JSON</button>
          <button id="importBtn" class="secondary">导入文件（坏文件只隔离）</button>
        </div>
        <div id="sealVerifyAll"></div>
      </div>
      <div class="panel">
        <h2>已封存潜次与快照还原</h2>
        <div id="restoreList" class="list"></div>
      </div>
      <div class="panel">
        <h2>启动提示与隔离区</h2>
        <div id="noticesList"></div>
        <div class="muted">坏版本、坏文件、还原/导入前的状态原文全部保存在隔离区，不覆盖、不删除，可逐条导出。</div>
        <div id="quarantineList"></div>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script src="js/crypto-util.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
